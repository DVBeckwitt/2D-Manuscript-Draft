schema_version = "slate-fit-recipe-v1"
case_id = "bi2x3_actual_profile_model"
title = "Bi2Se3 and Bi2Te3 physical geometry, profile-mosaic, and ordered-SF replay"
study_id = "ornl-2024-07-25-layered-chalcogenides"
accepted_run_id = "bi2x3-actual-profile-model-2026-08-27"
specimens = ["Bi2Se3", "Bi2Te3"]

[engine]
repository_uri = "slate-active://"
commit = "f67993d7a5890ebe231a4ba076b32d8f6814bc79"
python_uri = "slate-active://.venv/Scripts/python.exe"
lock_uri = "slate-active://uv.lock"
lock_sha256 = "543d14f3bfeaa58a64ad0e55166242c3122ee805ea7feb9a921e4c2f749a1fd4"

[geometry_contract]
beam_center_column_row_px = [1453.12, 1596.422]
active_parameters = [
  "detector_column_tilt_rad",
  "detector_row_tilt_rad",
  "sample_normal_y_tilt_rad",
  "goniometer_axis_pitch_rad",
  "goniometer_axis_yaw_rad",
  "sample_plane_normal_offset_m",
  "goniometer_pivot_pitch_offset_m",
  "detector_plane_normal_offset_m",
  "incidence_angle_delta_rad",
]
fixed_parameters = [
  "sample_normal_x_tilt_rad",
  "goniometer_pivot_yaw_offset_m",
  "detector_reference_column_offset_px",
  "detector_reference_row_offset_px",
]

[scientific_claim]
classification = "MODEL_LIMITED_ACTUAL_PROFILE_MODEL_REFIT"
canonical = false
limitations = [
  "Geometry is the fresh fixed-angle nine-parameter checkpoint and was not changed by the mosaic or SF stages.",
  "The Bi2Te3 geometry checkpoint contacts the declared goniometer-pivot-pitch and detector-plane-normal-offset bounds; it is retained as a bound-limited candidate, not a canonical calibration.",
  "Mosaic and SF acceptance require adjacent source-quadrature agreement; unconverged estimates remain model-conditioned rather than canonical.",
  "The detector application panes use a labeled two-source qualitative replay projected to fitted observation counts; scientific checkpoints use the declared high-source ladder.",
  "Full reciprocal-axis curves outside shaded observation windows are post-fit detector-supported replay, not additional fitted evidence.",
  "The 10-degree SF comparison profiles its own image scale and is conditional peak-pattern validation, not an absolute cross-angle intensity prediction.",
]

[replay]
status = "CAPTURED_ONLY"
reason = "The reusable external executor is captured with hash-bound project templates and accepted artifacts, but its staged high-source run is not exposed as the library's typed slate_project replay operation."

[[stages]]
id = "preprocess"
status = "COMPLETED"
method = "reuse frozen exposure-scaled timed-dark and radial-background checkpoints"

[[stages]]
id = "geometry"
status = "MODEL_LIMITED"
method = "reuse fresh nine-parameter fixed-angle detector-position checkpoints with fixed beam center; Bi2Te3 retains two declared bound contacts"

[[stages]]
id = "mosaic"
status = "MODEL_LIMITED"
method = "actual Ewald/refraction/source/finite-stack detector-profile fit with adjacent source-count confirmation"

[[stages]]
id = "ordered_intensity"
status = "MODEL_LIMITED"
method = "affine-sideband count fit with symmetry-linked z shifts, nested common Uiso sensitivity, and adjacent source-pattern confirmation"

[[stages]]
id = "render"
status = "COMPLETED"
method = "beam-center-cropped application detector comparison plus full detector-supported crystal-axis Qc* replay"

[method]
executor = "executors/refit_actual_model.py"
geometry = "saved nine-parameter fixed-angle fit with fixed beam center"
mosaic = "all accepted m1 and predeclared supported 00L detector-profile shapes evaluated by the physical Ewald/refraction/finite-stack model"
structure_factor = "matched affine-sideband contrast counts with one scale per image, adjacent-source peak-pattern confirmation, and R-3m mate-linked z shifts plus an optional common additive Uiso shift"
display = "measured dark-corrected image beside actual-model signal plus frozen radial background, area-averaged and cropped exactly at the fixed beam-center row"
reciprocal_profile = "full detector-supported crystal-axis Qc* distribution with nominal L top axis"

[constraints]
beam_center_column_row_px = [1453.12, 1596.422]
geometry_active_parameter_count = 9
profile_amplitudes_are_nuisance = true
profile_background_is_affine_nuisance = true
sf_scale_per_image = true
occupancies_fixed = true
finite_stack_termination_fixed = true
canonical_update = false

[qualification]
notes = [
  "Mosaic widths are inferred from physical profile shape, not integrated peak brightness.",
  "Bi2Se3 uses 33 accepted physical profiles; its fitted Gaussian and Lorentzian widths are locally resolved, but profile mismatch and 256-to-512 source confirmation fail the acceptance gates.",
  "Bi2Te3 uses 43 accepted physical profiles; its 0.320-degree Lorentzian HWHM is locally resolved, while the minor Gaussian component is unresolved and the profile/source gates remain model-limited.",
  "Mosaic profiles start at 128 source states and must agree profile-by-profile with the next 256-state replay; a failed adjacent check advances once to a 256-state fit with 512-state confirmation.",
  "The optional common Uiso term is accepted only after the z-only model passes and the larger model adds full-rank, interior, distributed conditional-pattern improvement.",
  "The selected SF state and the CIF baseline must reproduce each image's profiled peak pattern within two percent under the adjacent source-count replay; a failure advances once from 128 to 256 fit states with 512-state confirmation.",
  "Bi2Se3 retains the CIF because constrained SF candidates worsen held-out 10-degree prediction; Bi2Te3 retains the CIF because its predictively improved symmetry-z candidate fails adjacent-source peak-pattern confirmation.",
  "SF covariance is reported only as local conditional sensitivity under heuristic empirical weights, and large absolute WRMS or maximum residual keeps the overall result model-limited.",
  "Application figures label detector-wide reciprocal curves outside fitted windows as post-fit replay.",
  "Detector panes use a two-state qualitative Cu Kalpha replay projected to the fitted counts on observation support; the source-converged fitted checkpoints remain unchanged.",
]


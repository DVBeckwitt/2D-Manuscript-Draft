]

[scientific_claim]
classification = "MODEL_LIMITED_CANDIDATE"
canonical = false
limitations = [
  "The timed-dark duration is inferred from the experimental log rather than the OSC header.",
  "The accepted geometry has two bound contacts.",
  "The mosaic Gaussian and Lorentzian components are weakly separable.",
  "The ordered-intensity candidate improves full-data WRMS by 3.02 percent but held-out 10-degree WRMS by only 0.53 percent; Te Uiso contacts its lower bound.",
  "Strong diffuse and anisotropic mismatch remains, especially for L5 and L10.",
]

